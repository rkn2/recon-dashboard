<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recon Data Progress</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --surf: #f4f2ed;
  --card: #fcfbf8;
  --ink: #1a1917;
  --ink2: #6b675d;
  --ink3: #9c9789;
  --rule: #ddd9cf;
  --blue: #2a78d6;
  --orange: #eb6834;
  --aqua: #1baf7a;
  --blue-w: rgba(42,120,214,.18);
  --orange-w: rgba(235,104,52,.18);
  --aqua-w: rgba(27,175,122,.18);
  --gray-dot: #b0ada5;
  --dmg0: #cde2fb;
  --dmg1: #86b6ef;
  --dmg2: #3987e5;
  --dmg3: #1c5cab;
  --dmg4: #184f95;
  --dmg5: #0d366b;
  --pop-bg: #fff;
  --pop-shadow: rgba(0,0,0,.12);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --surf:#131311;--card:#1e1e1b;--ink:#ede9e1;--ink2:#a39e92;--ink3:#706c62;--rule:#333029;
    --blue:#3987e5;--orange:#d95926;--aqua:#199e70;
    --blue-w:rgba(57,135,229,.22);--orange-w:rgba(217,89,38,.22);--aqua-w:rgba(25,158,112,.22);
    --gray-dot:#706c62;
    --dmg0:#1c5cab;--dmg1:#256abf;--dmg2:#3987e5;--dmg3:#6da7ec;--dmg4:#86b6ef;--dmg5:#b7d3f6;
    --pop-bg:#2a2a27;--pop-shadow:rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --surf:#131311;--card:#1e1e1b;--ink:#ede9e1;--ink2:#a39e92;--ink3:#706c62;--rule:#333029;
  --blue:#3987e5;--orange:#d95926;--aqua:#199e70;
  --blue-w:rgba(57,135,229,.22);--orange-w:rgba(217,89,38,.22);--aqua-w:rgba(25,158,112,.22);
  --gray-dot:#706c62;
  --dmg0:#1c5cab;--dmg1:#256abf;--dmg2:#3987e5;--dmg3:#6da7ec;--dmg4:#86b6ef;--dmg5:#b7d3f6;
  --pop-bg:#2a2a27;--pop-shadow:rgba(0,0,0,.35);
}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--surf);color:var(--ink);font-family:"DM Sans",system-ui,-apple-system,sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:36px 24px 64px}

header{margin-bottom:32px}
header h1{font-size:22px;font-weight:600;letter-spacing:-.01em;margin:0 0 3px;text-wrap:balance}
header p{font-size:13px;color:var(--ink3);margin:0}

.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:36px}
.tile{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:18px 18px 14px}
.tile-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.dot{border-radius:50%;flex-shrink:0}
.dot-sm{width:7px;height:7px}
.dot-lg{width:8px;height:8px}
.tile-val{font-size:34px;font-weight:700;line-height:1;margin-bottom:4px}
.tile-sub{font-size:12px;color:var(--ink3)}
.tile-entry{display:inline-block;margin-top:8px;font-size:12px;font-weight:600;text-decoration:none}
.tile-entry:hover{text-decoration:underline}

.proj{margin-bottom:32px}
.proj-hd{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin-bottom:10px;display:flex;align-items:center;gap:6px}
.entry-btn{margin-left:auto;font-size:11px;font-weight:600;text-decoration:none;text-transform:none;letter-spacing:0;padding:5px 14px;border-radius:5px;background:var(--btn-c,var(--blue));color:#fff;transition:opacity .15s}
.entry-btn:hover{opacity:.85}
.entry-soon{margin-left:auto;font-size:10px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink3);font-style:italic}
.proj-body{display:grid;grid-template-columns:240px 1fr;gap:16px;align-items:start}

.bar-row{display:grid;grid-template-columns:74px 1fr 30px;align-items:center;gap:8px;height:26px}
.bar-nm{font-size:13px;color:var(--ink2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-tr{height:14px;border-radius:0 3px 3px 0}
.bar-fl{height:100%;border-radius:0 3px 3px 0;min-width:2px}
.bar-v{font-size:12px;font-variant-numeric:tabular-nums;color:var(--ink2)}

.map-ctr{background:var(--card);border:1px solid var(--rule);border-radius:6px;overflow:hidden;position:relative}
.map-box{height:350px;width:100%}
.leaflet-popup-content-wrapper{border-radius:6px!important;font-family:"DM Sans",system-ui,sans-serif!important}
.leaflet-popup-content{margin:10px 14px!important;font-size:12.5px!important;line-height:1.55!important;color:var(--ink)}
.leaflet-popup-content b{font-weight:600}
.pop-addr{font-weight:600;font-size:13px;margin-bottom:4px;line-height:1.35}
.pop-row{display:flex;gap:6px}
.pop-lbl{color:var(--ink3);min-width:76px;flex-shrink:0}

.map-legend{position:absolute;bottom:12px;right:12px;z-index:800;background:var(--card);border:1px solid var(--rule);border-radius:4px;padding:6px 10px;font-size:10px;color:var(--ink3);display:flex;flex-direction:column;gap:3px}
.map-legend .lg-row{display:flex;align-items:center;gap:5px}
.map-legend .lg-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

.stats{margin-top:44px}
.stats h2{font-size:16px;font-weight:600;margin:0 0 18px;text-wrap:balance}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.scard{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:14px 16px}
.scard h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);margin:0 0 10px}
.s-row{display:grid;grid-template-columns:110px 1fr 30px;align-items:center;gap:6px;height:21px}
.s-lbl{font-size:11.5px;color:var(--ink2);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-tr{height:11px;background:var(--rule);border-radius:0 3px 3px 0;overflow:hidden}
.s-fl{height:100%;border-radius:0 3px 3px 0}
.s-v{font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--ink3)}

@media(max-width:640px){
  .tiles{grid-template-columns:1fr}
  .proj-body{grid-template-columns:1fr}
  .map-box{height:260px}
  .stats-grid{grid-template-columns:1fr}
  .tile-val{font-size:28px}
}
</style>
</head>

const colorMap={blue:'#2a78d6',orange:'#eb6834',aqua:'#1baf7a'};

function esc(s){if(!s)return'—';const d=document.createElement('span');d.textContent=s;return d.innerHTML}
function fmt(k){return(k||'unknown').replace(/_/g,' ')}

function popupHtml(p){
  let h=`<div class="pop-addr">${esc(p.a)}</div>`;
  if(p.bn) h+=`<div class="pop-row"><span class="pop-lbl">Name</span>${esc(p.bn)}</div>`;
  if(p.s) h+=`<div class="pop-row"><span class="pop-lbl">Entered by</span>${esc(p.s)}</div>`;
  if(p.oc) h+=`<div class="pop-row"><span class="pop-lbl">Occupancy</span>${fmt(p.oc)}</div>`;
  if(p.yr) h+=`<div class="pop-row"><span class="pop-lbl">Year built</span>${p.yr}</div>`;
  if(p.st) h+=`<div class="pop-row"><span class="pop-lbl">Stories</span>${p.st}</div>`;
  if(p.ct) h+=`<div class="pop-row"><span class="pop-lbl">Construction</span>${fmt(p.ct)}</div>`;
  if(p.ar){let ar=p.ar;if(/^\d+$/.test(ar))ar='T'+ar;h+=`<div class="pop-row"><span class="pop-lbl">Archetype</span>${ar}</div>`;}
  if(p.wd!==undefined&&p.wd!==null) h+=`<div class="pop-row"><span class="pop-lbl">Wind damage</span>${p.wd} / 5</div>`;
  if(p.ds) h+=`<div class="pop-row"><span class="pop-lbl">Damage status</span>${fmt(p.ds)}</div>`;
  return h;
}

// Tiles
const tilesEl=document.getElementById('tiles');
PROJECTS.forEach(pr=>{
  const t=document.createElement('div');t.className='tile';
  t.innerHTML=`<div class="tile-lbl"><span class="dot dot-lg" style="background:var(--${pr.color})"></span>${pr.label}</div>
    <div class="tile-val" style="color:var(--${pr.color})">${pr.total}</div>
    <div class="tile-sub">buildings surveyed by ${pr.nstu} students</div>
    ${pr.entryUrl?`<a href="${pr.entryUrl}" class="tile-entry" style="color:var(--${pr.color})">Enter data &rarr;</a>`:''}`;
  tilesEl.appendChild(t);
});

// Projects with Leaflet maps
const projEl=document.getElementById('projects');
const maps=[];

PROJECTS.forEach(pr=>{
  const sec=document.createElement('div');sec.className='proj';
  const hd=document.createElement('div');hd.className='proj-hd';
  hd.innerHTML=`<span class="dot dot-sm" style="background:var(--${pr.color})"></span>${pr.label}${pr.entryUrl?`<a href="${pr.entryUrl}" class="entry-btn" style="--btn-c:var(--${pr.color})">Enter Data</a>`:'<span class="entry-soon">Form coming soon</span>'}`;
  sec.appendChild(hd);
  const body=document.createElement('div');body.className='proj-body';

  // Bars
  const barsDiv=document.createElement('div');
  Object.entries(pr.students).sort((a,b)=>b[1]-a[1]).forEach(([nm,ct])=>{
    const r=document.createElement('div');r.className='bar-row';
    r.innerHTML=`<div class="bar-nm">${nm}</div><div class="bar-tr"><div class="bar-fl" style="width:${(ct/MAX_BAR*100).toFixed(1)}%;background:var(--${pr.color})"></div></div><div class="bar-v">${ct}</div>`;
    barsDiv.appendChild(r);
  });
  body.appendChild(barsDiv);

  // Map container
  const mapCtr=document.createElement('div');mapCtr.className='map-ctr';
  const mapId='map-'+pr.key;
  const mapBox=document.createElement('div');mapBox.className='map-box';mapBox.id=mapId;
  mapCtr.appendChild(mapBox);

  // Legend for StL
  if(pr.key==='stlouis'){
    const lg=document.createElement('div');lg.className='map-legend';
    lg.innerHTML=`<div class="lg-row"><span class="lg-dot" style="background:#cde2fb;border:1px solid #2a78d6"></span>0</div>
      <div class="lg-row"><span class="lg-dot" style="background:#86b6ef;border:1px solid #2a78d6"></span>1</div>
      <div class="lg-row"><span class="lg-dot" style="background:#b0ada5"></span>not rated</div>`;
    mapCtr.appendChild(lg);
  }

  body.appendChild(mapCtr);
  sec.appendChild(body);
  projEl.appendChild(sec);

  // Initialize Leaflet map after DOM is in place
  maps.push({pr,mapId});
});

// Create maps after all DOM elements are appended
requestAnimationFrame(()=>{
  maps.forEach(({pr,mapId})=>{
    const map=L.map(mapId,{scrollWheelZoom:true,zoomControl:true});
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
      attribution:'&copy; OpenStreetMap',
      maxZoom:19
    }).addTo(map);

    const pts=D[pr.key].filter(pr.filter);
    const bounds=[];

    pts.forEach(p=>{
      if(!p.la||!p.lo)return;
      let fillColor,strokeColor,fillOpacity;

      if(pr.key==='stlouis'){
        if(p.wd!==undefined&&p.wd!==null){
          fillColor=dmgColors[Math.min(p.wd,5)];
          strokeColor='#2a78d6';
          fillOpacity=0.85;
        } else {
          fillColor='#b0ada5';
          strokeColor='#b0ada5';
          fillOpacity=0.5;
        }
      } else {
        fillColor=colorMap[pr.color];
        strokeColor=colorMap[pr.color];
        fillOpacity=0.35;
      }

      const marker=L.circleMarker([p.la,p.lo],{
        radius:6,
        fillColor:fillColor,
        color:strokeColor,
        weight:1.5,
        opacity:0.9,
        fillOpacity:fillOpacity
      }).addTo(map);

      marker.bindPopup(popupHtml(p),{maxWidth:280,className:''});
      marker.bindTooltip(p.a||'No address',{direction:'top',offset:[0,-8]});
      bounds.push([p.la,p.lo]);
    });

    if(bounds.length){
      map.fitBounds(bounds,{padding:[20,20],maxZoom:16});
    }
  });
});

// Stats
function statChart(title,obj,color){
  const card=document.createElement('div');card.className='scard';
  card.innerHTML=`<h3>${title}</h3>`;
  const sorted=Object.entries(obj).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const mx=sorted[0]?sorted[0][1]:1;
  sorted.forEach(([k,v])=>{
    const r=document.createElement('div');r.className='s-row';
    r.innerHTML=`<div class="s-lbl">${fmt(k)}</div><div class="s-tr"><div class="s-fl" style="width:${(v/mx*100).toFixed(1)}%;background:${color}"></div></div><div class="s-v">${v}</div>`;
    card.appendChild(r);
  });
  return card;
}

const all=[...D.stlouis,...D.montpelier,...D.marshall];
const grid=document.getElementById('sgrid');

const occs={};
all.forEach(d=>{let o=(d.oc||'unknown').toLowerCase();if(o==='buisness')o='business';if(o==='residenital')o='residential';occs[o]=(occs[o]||0)+1});
grid.appendChild(statChart('Occupancy type',occs,'var(--ink2)'));

const cts={};
all.forEach(d=>{let c=(d.ct||'unknown').toLowerCase();if(c==='masonary_un')c='masonry_un';cts[c]=(cts[c]||0)+1});
grid.appendChild(statChart('Construction type',cts,'var(--ink2)'));

const archs={};
all.forEach(d=>{let a=d.ar||'unknown';if(/^\d+$/.test(a))a='T'+a;archs[a]=(archs[a]||0)+1});
grid.appendChild(statChart('Building archetype',archs,'var(--ink2)'));

const dmg={};
D.stlouis.forEach(d=>{const k=d.wd!==undefined&&d.wd!==null?String(d.wd):'not rated';dmg[k]=(dmg[k]||0)+1});
grid.appendChild(statChart('Wind damage rating (St. Louis)',dmg,'var(--blue)'));
</script>
